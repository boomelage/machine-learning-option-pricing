[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlop"
version = "0.1.0"
description = "Contract generation and machine learning approximation of option prices"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "boomelage", email = "163606270+boomelage@users.noreply.github.com" }]

dependencies = [
    "numpy",
    "pandas",
    # Becomes a direct import once the convsklearn wrappers are vendored into src/;
    # they are used only here, so an external package bought nothing.
    "scikit-learn",
    "tqdm",
    "joblib",
    # First-party, pinned by commit for reproducibility. Replaces quantlib_pricers,
    # which is retired: it priced Asian options on an inverted fixing schedule and
    # returned dicts from its df_* methods.
    "qlpricing @ git+https://github.com/boomelage/qlpricing@4705d695dff787c88004c8061d591543ccc7cc35",
]

[tool.setuptools.packages.find]
where = ["src"]
